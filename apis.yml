name: MySpace
description: >-
  Myspace (Myspace LLC, part of the People / Entertainment Weekly Network) is a
  music and culture social platform focused on artist networking, music
  streaming, and editorial entertainment coverage. Originally one of the largest
  social networks of the 2000s, it was surfaced in the API Evangelist network as
  a portfolio company of Redpoint Ventures. As of this enrichment pass Myspace
  operates a consumer music/entertainment website only — its former developer
  platform (developer.myspace.com, OpenSocial-based) has been retired and no
  public API, developer portal, OpenAPI, or API documentation surface could be
  found. This profile therefore carries identity and domain-security signal
  only, with no API artifacts.
